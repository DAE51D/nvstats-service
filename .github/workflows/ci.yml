name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-dbus python3-gi dbus-daemon
      - run: python -m py_compile service/*.py backend/*.py
      - run: python -m unittest discover -s tests
      - run: bash -n install.sh
      - run: dbus-run-session -- python3 scripts/smoke_dbus.py
